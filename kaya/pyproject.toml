[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knockon"
version = "0.1.0"
description = "KNOCK-ON: substitution decision tools for data-center equipment (MCP server, API, evidence workbench)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.9,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30",
  "pydantic>=2.7,<3",
  "pdfplumber>=0.11",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4", "pillow>=10", "httpx>=0.27"]

[project.scripts]
knockon-mcp = "knockon.mcp_server:main"
knockon-api = "knockon.api:main"
knockon-eval = "knockon.evaluate:main"

[tool.setuptools.packages.find]
include = ["knockon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
