<!DOCTYPE html>
<html>
<head>
    <title>Signup Page</title>
</head>
<body>

    <center>
        <h2 style="color:red;">Please signup here!!!</h2>

        <form>
            <table border="1" cellpadding="8" cellspacing="0">

                <tr>
                    <td>Enter UserName:</td>
                    <td colspan="2">
                        <input type="text" name="username">
                    </td>
                </tr>

                <tr>
                    <td>Enter Password:</td>
                    <td colspan="2">
                        <input type="password" name="password">
                    </td>
                </tr>

                <tr>
                    <td>Confirm Password:</td>
                    <td colspan="2">
                        <input type="password" name="confirm_password">
                    </td>
                </tr>

                <tr>
                    <td>Select Gender:</td>
                    <td colspan="2">
                        <input type="radio" name="gender"> Male
                        <input type="radio" name="gender"> Female
                    </td>
                </tr>

                <tr>
                    <td>Enter MobileNumber:</td>
                    <td colspan="2">
                        <input type="tel" name="mobile">
                    </td>
                </tr>

                <tr>
                    <td>Enter DOB:</td>
                    <td colspan="2">
                        <input type="date" name="dob">
                    </td>
                </tr>

                <tr>
                    <td>Enter Address:</td>
                    <td colspan="2">
                        <textarea rows="5" cols="30"></textarea>
                    </td>
                </tr>

                <tr>
                    <td>Select Qualification:</td>
                    <td colspan="2">
                        <select>
                            <option>Select</option>
                            <option>B.Tech</option>
                            <option>M.Tech</option>
                            <option>B.Sc</option>
                            <option>MCA</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Choose your Skills:</td>
                    <td colspan="2">
                        <select multiple size="4">
                            <option>Java</option>
                            <option>HTML5</option>
                            <option>CSS3</option>
                            <option>JavaScript</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Prefered Shift:</td>
                    <td colspan="2">
                        <input type="checkbox"> DayShift
                        <input type="checkbox"> NightShift
                        <input type="checkbox"> DayShift/NightShift
                    </td>
                </tr>

                <tr>
                    <td>Upload your resume:</td>
                    <td colspan="2">
                        <input type="file">
                    </td>
                </tr>

                <tr>
                    <td colspan="3" align="center">
                        <input type="submit" value="Register">
                        <input type="reset" value="reset">
                    </td>
                </tr>

            </table>
        </form>
    </center>

</body>
</html>
